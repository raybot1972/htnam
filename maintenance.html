<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>HTIT — Scheduled Maintenance</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #dfe1f5; background: radial-gradient(circle at 15% 15%, rgba(0,210,255,.16), transparent 35%), radial-gradient(circle at 85% 80%, rgba(225,3,125,.13), transparent 35%), #0f1320; }
      main { width: min(680px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid rgba(71,214,255,.22); border-radius: 24px; background: rgba(23,27,41,.88); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      .brand { width: min(430px, 100%); aspect-ratio: 1.72 / 1; overflow: hidden; border: 1px solid rgba(71,214,255,.2); border-radius: 18px; background: #071024; }
      .brand img { width: 100%; height: 100%; object-fit: cover; object-position: center 49%; }
      .eyebrow { margin: 28px 0 8px; color: #47d6ff; font: 700 12px/1.4 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.1rem, 8vw, 4rem); letter-spacing: -.04em; }
      p { max-width: 52ch; color: #bbc9cf; font-size: 1.05rem; line-height: 1.75; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; color: #a5e7ff; font: 600 13px/1.4 ui-monospace, monospace; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #47d6ff; box-shadow: 0 0 18px #47d6ff; animation: pulse 1.8s infinite; }
      @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="images/htit-brand-lockup-v2.png" alt="Human Touch Information Technology — Where People Meet Technology" /></div>
      <p class="eyebrow">Scheduled maintenance</p>
      <h1>We’re refining the experience.</h1>
      <p>The HTIT website is temporarily offline while we publish an update. Please check back shortly.</p>
      <div class="status"><span class="dot"></span> Maintenance in progress</div>
    </main>
  </body>
</html>
